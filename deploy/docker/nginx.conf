# Nginx config for the containerized "edge" profile (docker compose --profile edge).
# Proxies to the `app` service over the compose network. Certs are mounted from
# the host at /etc/letsencrypt (issue them with certbot on the host first).
# Replace auction.example.com with your domain.

upstream pi_auctions_app {
    server app:3000;
}

server {
    listen 80;
    server_name auction.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name auction.example.com;

    ssl_certificate     /etc/letsencrypt/live/auction.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auction.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    location /socket.io/ {
        proxy_pass http://pi_auctions_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://pi_auctions_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
