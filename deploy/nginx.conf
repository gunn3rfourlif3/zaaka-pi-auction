# ============================================================================
# Nginx reverse proxy for Pi Auctions
# ----------------------------------------------------------------------------
# Place at: /etc/nginx/sites-available/pi-auctions
# Enable:   ln -s /etc/nginx/sites-available/pi-auctions /etc/nginx/sites-enabled/
# Test:     nginx -t   &&   systemctl reload nginx
#
# Replace auction.example.com with your real domain BEFORE requesting a cert.
# TLS blocks below are managed by Certbot:
#   certbot --nginx -d auction.example.com
# ============================================================================

# --- Upstream: the Node custom server (server.js) bound to localhost ---------
upstream pi_auctions_app {
    server 127.0.0.1:3000;
    keepalive 32;
}

# --- HTTP -> HTTPS redirect ---------------------------------------------------
server {
    listen 80;
    listen [::]:80;
    server_name auction.example.com;

    # Allow ACME HTTP-01 challenges (Certbot) before the redirect.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# --- HTTPS server -------------------------------------------------------------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name auction.example.com;

    # ---- TLS (paths written by Certbot; shown here for reference) ----
    ssl_certificate     /etc/letsencrypt/live/auction.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/auction.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # Uploads (auction images). Match MAX_FILE_SIZE (5MB) with headroom.
    client_max_body_size 10m;

    # Security headers are primarily set by the app (next.config.js);
    # HSTS is reinforced here at the edge.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- WebSocket / Socket.IO ----
    location /socket.io/ {
        proxy_pass http://pi_auctions_app;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;   # keep long-lived sockets/polling alive
    }

    # ---- Everything else (Next.js app + API routes) ----
    location / {
        proxy_pass http://pi_auctions_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 90s;
    }
}
